app = "phondo-voice"
primary_region = "syd"

# SCRUM-579: server.js sets SHUTDOWN_GRACE_MS = 15s to drain active calls, but
# Fly's default kill_timeout is 5s — the drain was being SIGKILLed a third of the
# way through. Every deploy hits it, and so does every autostop whenever
# min_machines_running is 0 (below), so give the drain room to finish.
kill_timeout = "20s"

[env]
  PORT = "3001"
  LLM_PROVIDER = "openai"
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  # SCRUM-580: ALWAYS-ON while tradie outreach or a pilot runs. Prospects ring
  # Phondo's line back after a cold call and try the demo line or /demo, all
  # served by this machine, and none of them should wait on a wake. Costs ~$39/mo
  # (one performance-1x/2GB machine up 24/7, idle or not). Merging this changes
  # nothing live: Fly applies it on the next deploy (runbook, "Always-on").
  #
  # Going back to 0 (SCRUM-579, scale to zero while idle) is only safe while no
  # pilot or customer line, outreach or marketing push is live. Fly's proxy then
  # autostarts the machine on the inbound Twilio webhook and holds the request
  # open while it boots. Measured wakes: ~6s with the image host-cached, but ~14.5s on the FIRST wake
  # after a deploy (the host re-pulls the image). Twilio's read timeout for call
  # HTTP requests is hard-capped at 15s, so that post-deploy wake leaves /twiml
  # almost no budget: the call falls through to the fallback URL and the caller
  # gets voicemail instead of the AI. Two surfaces wake the machine, not one:
  # inbound Twilio calls AND the PUBLIC /demo page, whose browser WebSocket to
  # /ws/test autostarts it the same way.
  #
  # Either way, ALWAYS deploy with ./voice-server/deploy.sh, never a bare
  # `fly deploy` (see docs/runbooks/voice-server.md).
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"   # 30s startup buffer — prevents transient warn/error during deploys
    method = "GET"
    path = "/health"
    protocol = "http"

[[vm]]
  size = "performance-1x"
  memory = "2gb"
